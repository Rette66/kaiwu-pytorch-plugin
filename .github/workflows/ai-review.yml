name: AI review

on:
  issues:
    types: [opened, edited, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or PR number
        required: true
        type: string
      repository:
        description: Leave empty for this fork; upstream parent is read-only
        required: false
        type: string

permissions: {}

concurrency:
  group: ai-review-${{ github.event_name }}-${{ inputs.repository || github.event.workflow_run.head_repository.full_name }}-${{ github.event.issue.number || github.event.workflow_run.head_branch || inputs.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.AI_REVIEW_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # Always execute the default branch's trusted collector, never the PR checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the review runner
        run: python3 -m unittest discover -s tests -p test_ai_review.py -v
      - name: Review collected evidence
        id: review
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_REVIEW_MODEL: ${{ vars.DEEPSEEK_REVIEW_MODEL }}
        run: python3 .github/ai_review.py review
      - name: Show the report
        if: always()
        run: |
          if [ -f review.md ]; then
            cat review.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save report and its evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review-packet.json
            review.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep incomplete reviews visibly failed
        if: steps.review.outcome == 'failure'
        run: exit 1

  publish:
    needs: review
    if: always() && needs.review.outputs.artifact-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.review.outputs.artifact-id }}
          merge-multiple: true
      - name: Update the fork's review comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f review-packet.json ] && [ -f review.md ]; then
            python3 .github/ai_review.py publish
          fi
